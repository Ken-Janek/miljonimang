<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miljonimäng - Ülesande Valideerimine</title>
    <link rel="stylesheet" href="css/style.css?v=orange-clean-20260512">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🎮 Miljonimäng</h1>
                <p class="subtitle">Kontrolli, kas saad lahendusest aru</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Loading State -->
            <div id="loadingState" class="state hidden">
                <div class="spinner"></div>
                <p>Laadin ülesandeid...</p>
            </div>

            <!-- Assignments List -->
            <div id="assignmentsState" class="state">
                <h2>Vali ülesanne:</h2>
                <div id="assignmentsList" class="assignments-list">
                    <!-- Will be populated by JavaScript -->
                </div>
            </div>

            <!-- Assignment Details -->
            <div id="assignmentDetailState" class="state hidden">
                <div class="assignment-detail">
                    <button class="btn-back" onclick="goBack()">← Tagasi</button>
                    <h2 id="detailTitle"></h2>
                    <div id="detailContent" class="markdown-content"></div>
                    <div class="action-buttons">
                        <button class="btn-primary" onclick="startGame()">Alusta mängu</button>
                        <button class="btn-secondary" onclick="goBack()">Tagasi</button>
                    </div>
                </div>
            </div>

            <!-- Error State -->
            <div id="errorState" class="state hidden">
                <div class="error-box">
                    <h3>❌ Viga!</h3>
                    <p id="errorMessage"></p>
                    <button class="btn-secondary" onclick="goBack()">Tagasi</button>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2026 Miljonimäng | Ülesannete valideerimine AI abil</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
